<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Synthetic Photos · HUD test</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f6f7f8;color:#26332a;font:16px system-ui}header{padding:24px 32px;background:white}h1{font-size:24px;margin:0}main{padding:32px;display:flex;flex-wrap:wrap;gap:16px}article{position:relative}article a{display:flex;align-items:center;justify-content:center;width:210px;height:180px;background:#c3d7c8;color:#26332a;text-decoration:none;font-size:24px}article:nth-child(2) a{background:#dbd0b6}article:nth-child(3) a{background:#bcd2df}article button{position:absolute;left:8px;top:8px;min-height:32px}button{padding:8px;font:inherit}button[aria-checked=true]{background:#225b3c;color:white}#viewer img{width:100%;height:100%;object-fit:contain}#viewer{height:70vh;width:100%;display:flex;align-items:center;justify-content:center;background:#d2dfd5;font-size:38px}nav{padding:0 32px;display:flex;gap:12px}.note{font-size:13px;margin:8px 0 0;color:#526058}</style></head><body><header><h1>Synthetic Photos</h1><p class="note">Offline fixture. No real photos, account data or Google requests.</p></header><nav><button id="grid">Grid</button><button id="previous">Previous</button><button id="next">Next</button></nav><main></main><script>
const ids=['DEMO_A','DEMO_B','DEMO_C'];let current=0;const selected=new Set();
function paint(){const match=location.pathname.match(/\/photo\/(DEMO_[ABC])/);document.querySelector('main').replaceChildren();if(match){current=ids.indexOf(match[1]);const view=document.createElement('div');view.id='viewer';const im=document.createElement('img');const portrait=current===1;const w=portrait?600:900,h=portrait?900:600;const colours=['#91b79a','#b6a882','#87aec4'];im.alt='Synthetic sample '+match[1].slice(-1);im.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><rect width="100%" height="100%" fill="'+colours[current]+'"/><rect x="60" y="60" width="'+(w-120)+'" height="'+(h-120)+'" fill="none" stroke="#26332a" stroke-width="8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="80" font-family="sans-serif" fill="#26332a">Sample '+match[1].slice(-1)+'</text></svg>');view.append(im);document.querySelector('main').append(view);}else{for(const id of ids){const card=document.createElement('article');card.setAttribute('role','gridcell');const a=document.createElement('a');a.href='/u/2/photo/'+id;a.textContent='Sample '+id.slice(-1);a.onclick=e=>{e.preventDefault();history.pushState({},'',a.href);paint();};const b=document.createElement('button');b.setAttribute('role','checkbox');b.setAttribute('aria-label','Select sample '+id.slice(-1));b.setAttribute('aria-checked',String(selected.has(id)));b.textContent=selected.has(id)?'Selected':'Select';b.onclick=()=>{if(selected.has(id))selected.delete(id);else selected.add(id);b.setAttribute('aria-checked',String(selected.has(id)));b.textContent=selected.has(id)?'Selected':'Select';};card.append(a,b);document.querySelector('main').append(card);}}}
function move(n){current=(current+n+ids.length)%ids.length;history.pushState({},'','/u/2/photo/'+ids[current]);paint();}document.querySelector('#grid').onclick=()=>{history.pushState({},'','/u/2/');paint();};document.querySelector('#next').onclick=()=>move(1);document.querySelector('#previous').onclick=()=>move(-1);window.onpopstate=paint;
// Simulates a host site's keyboard navigation; not a Google Photos integration assertion.
document.addEventListener('keydown',event=>{if(event.defaultPrevented||event.target.closest?.('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowRight')move(1);if(event.key==='ArrowLeft')move(-1);});
paint();
</script></body></html>
